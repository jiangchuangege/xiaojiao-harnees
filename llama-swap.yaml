# llama-swap 配置 —— 小焦多大脑热切换
# llama-swap 监听 8080，按 model 名把请求路由到对应 upstream(动态端口 ${PORT})，按需加载/卸载 → 秒级切换、省显存。
# ⚠️ **下面是开发这套代码那台机器上的绝对路径**（模型/`llama-server` 各自在哪）。
#    换台机器**不用改代码**，二选一：
#      · 一条命令对齐：`python tools/setup_paths.py --apply`（自动探测；只改"指向不存在文件"的那几行，先备份）
#      · 或自己指定：`set XIAOJIAO_LLAMA_SERVER=完整路径` / `set XIAOJIAO_GGUF=完整路径`
#    装机器时 `install_all.py` / `install_auto.py` 会**自动做这一步**。
#    改完复检：`python tools/check_brain_paths.py`；解析逻辑只有一份，在 `core/paths.py`。
# 全局：llama-swap 等 upstream 变健康的上限（秒）。默认 120 ——
# 实测 deepseek-v4 首次加载要 120.6 秒，正好被默认值卡死在门外（报 health check timed out）。
healthCheckTimeout: 300
models:
  xiaojiao:
    cmd: C:/llama/llama-server.exe --port ${PORT} --model C:/llama/xiaojiao1.0-4B.gguf -c 20000 --reasoning off
    ttl: 0               # 不自动卸载(由小焦/视频切换时主动 unload)
    useModelName: xiaojiao1.0-4B
  coder:
    # 【2026-09-18 修一条死路由】这里原来指着 `G:/模型文件/工具调用模型/Qwen3-8B-Q4_K_M.gguf`，
    #   实测那个文件**不存在**（模型被挪到了 `G:/moxing__xiaojiao/工具调用模型/`）。
    #   后果：路由键 `coder` 看着在配置里，实际一调就起不来 —— 而且它不会报错，只会一直等。
    #   现在按实测路径写上；换盘/挪目录时记得一起改这里（`tools/check_brain_paths.py` 可体检）。
    cmd: "C:/llama/llama-server.exe --port ${PORT} --model G:/moxing__xiaojiao/工具调用模型/Qwen3-8B-Q4_K_M.gguf -c 20000 --reasoning off"
    ttl: 0
    useModelName: qwen3-8b
  # 未来可加更多大脑(填进 models 即可被调度):
  # deepseek:
  #   cmd: ... --port ${PORT} --model <deepseek.gguf>
  #   ttl: 0
  deepseek-v4:
    cmd: "C:/llama/llama-server.exe --port ${PORT} --model G:/moxing__xiaojiao/推理模型/DeepSeek-V4-Pro-Qwen3.5-4B-MTP-Q8_0.gguf -c 20000 --reasoning off"
    ttl: 0
    useModelName: deepseek-v4
  qwopus3.5-4b-coder-mtp-q5_k_m.gguf:
    # 【2026-09-19 修：路径里有空格必须加引号】用户接的这个模型放在 `C:/xiaojiao/xiaojiao harness/` ——
    #   **目录名里有个空格**，而上面那条路径没加引号 → 命令行被拆成两截：
    #   llama-server 收到 `harness\Qwopus3.5-4B-Coder-MTP-Q5_K_M.gguf` 这种残片 → 报
    #   `error: invalid argument` → **进程立刻退出** → llama-swap 只报
    #   「unsupported error: upstream command exited prematurely」→ 页面显示 HTTP 500。
    #   实测复现：直接起一次 llama-server 拿到同一行 `invalid argument`，所以根因不是模型坏了、也不是显存。
    #   （`${PORT}` 是 llama-swap 的占位符，在**双引号**里才会被替换，所以外层用单引号、内层用双引号。）
    cmd: 'C:/llama/llama-server.exe --port ${PORT} --model "C:/xiaojiao/xiaojiao harness/Qwopus3.5-4B-Coder-MTP-Q5_K_M.gguf" -c 20000 --reasoning off'
    ttl: 0
    useModelName: qwopus3.5-4b-coder-mtp-q5_k_m.gguf
